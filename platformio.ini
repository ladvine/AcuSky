; AcuSky PlatformIO configuration

[env:esp32cam]
platform  = espressif32
board     = esp32cam
framework = arduino

; PSRAM must be enabled for UXGA resolution
board_build.partitions = huge_app.csv

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps =
    ; Captive-portal WiFi provisioning (tzapu/WiFiManager)
    ; tzapu/WiFiManager @ ^2.0.17

    ; BME280 and AHT10 are vendored in src/ — no entries needed

monitor_speed = 115200
upload_speed  = 921600
